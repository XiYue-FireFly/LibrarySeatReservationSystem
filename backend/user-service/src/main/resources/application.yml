server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/library_system?useUnicode=true&characterEncoding=UTF-8&serverTimezone=GMT%2B8
    username: library_system
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
    servlet:
      multipart:
        max-file-size: 5MB
        max-request-size: 5MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

file:
  upload-dir: uploads
